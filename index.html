  <!-- shared SVG defs: restrained Arc90 progress gradients -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- mono/white-black theme ring -->
      <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#c8c8c8"/>
        <stop offset="100%" stop-color="#ffffff"/>
      </linearGradient>
      <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.20"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="donutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#c8c8c8"/>
        <stop offset="100%" stop-color="#ffffff"/>
      </linearGradient>
      <!-- dark theme ring: cool blue into sage -->
      <linearGradient id="ringGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#9ac9ed"/>
        <stop offset="100%" stop-color="#b3dfbd"/>
      </linearGradient>
      <linearGradient id="areaGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#b3dfbd" stop-opacity="0.24"/>
        <stop offset="100%" stop-color="#b3dfbd" stop-opacity="0"/>
      </linearGradient>
      <!-- gold theme ring: ivory into champagne, reads as brushed metal -->
      <linearGradient id="ringGradGold" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f6ecd6"/>
        <stop offset="100%" stop-color="#e3c27d"/>
      </linearGradient>
      <linearGradient id="areaGradGold" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#e3c27d" stop-opacity="0.30"/>
        <stop offset="100%" stop-color="#e3c27d" stop-opacity="0"/>
      </linearGradient>
      <!-- light theme ring (dark on white) -->
      <linearGradient id="ringGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#444444"/>
        <stop offset="100%" stop-color="#111111"/>
      </linearGradient>
    </defs>
  </svg>
